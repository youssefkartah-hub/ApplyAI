<svg viewBox="0 0 600 300" role="group" aria-label="How SARAH is put together. A Notion tracker and a Google Calendar feed a local Python server, which serves one HTML page and keeps local data. Optional services connect only when switched on. Select a block to read what it does.">

  <line x1="153" y1="135" x2="219" y2="135" class="ln" marker-start="url(#sa-ah)" marker-end="url(#sa-ah)"/><text class="t10 tm" x="186" y="127">two-way</text>
