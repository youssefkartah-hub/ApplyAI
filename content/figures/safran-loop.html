<svg viewBox="0 0 530 266" role="group" aria-label="Test-to-closure loop for a part. A part goes on the bench, the test runs to a work instruction, the results are logged, and an in-spec decision either releases the part or sends it to a hold tag and a nonconformance report, then a root cause data pack, then closure. Three numbered markers show where I changed the loop.">
  <defs><marker id="s-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="mk"/></marker></defs>
  <rect x="10" y="20" width="150" height="52" rx="3" class="box"/><text class="t11 tm" x="85" y="42">part on bench</text><text class="t10 tm" x="85" y="59">6 part numbers</text>
  <rect x="180" y="20" width="160" height="52" rx="3" class="box-a"/><text class="t11 tm" x="260" y="42">run test</text><text class="t10 tm" x="260" y="59">work instruction</text>
  <rect x="365" y="20" width="150" height="52" rx="3" class="box-a"/><text class="t11 tm" x="440" y="42">log results</text><text class="t10 tm" x="440" y="59">MATLAB, Excel, traveler</text>
  <polygon points="440,98 492,128 440,158 388,128" class="box"/><text class="t11 tm" x="440" y="132">in spec?</text>
  <rect x="180" y="106" width="160" height="44" rx="3" class="box"/><text class="t11 tm" x="260" y="132">release</text>
  <rect x="365" y="200" width="150" height="52" rx="3" class="box"/><text class="t11 tm" x="440" y="222">hold tag + NCR</text><text class="t10 tm" x="440" y="239">nonconformance report</text>
  <rect x="180" y="200" width="160" height="52" rx="3" class="box-a"/><text class="t11 tm" x="260" y="222">RCCA data pack</text><text class="t10 tm" x="260" y="239">traces, as-built, photos</text>
  <rect x="10" y="204" width="150" height="44" rx="3" class="box"/><text class="t11 tm" x="85" y="230">NCR closed</text>
  <line x1="160" y1="46" x2="177" y2="46" class="ln" marker-end="url(#s-ah)"/>
  <line x1="340" y1="46" x2="362" y2="46" class="ln" marker-end="url(#s-ah)"/>
  <line x1="440" y1="72" x2="440" y2="95" class="ln" marker-end="url(#s-ah)"/>
  <line x1="388" y1="128" x2="343" y2="128" class="ln" marker-end="url(#s-ah)"/><text class="t10 tm" x="365" y="121">yes</text>
  <line x1="440" y1="158" x2="440" y2="197" class="ln" marker-end="url(#s-ah)"/><text class="t10" x="448" y="182">no</text>
  <line x1="365" y1="226" x2="343" y2="226" class="ln" marker-end="url(#s-ah)"/>
  <line x1="180" y1="226" x2="163" y2="226" class="ln" marker-end="url(#s-ah)"/>
  <g class="badge" data-k="1" tabindex="0" role="button" aria-label="Change 1: work instructions and checklists"><circle cx="340" cy="20" r="12" class="fa"/><text class="badge-t tm" x="340" y="24">1</text></g>
  <g class="badge" data-k="2" tabindex="0" role="button" aria-label="Change 2: test logs and traveler fields"><circle cx="515" cy="20" r="12" class="fa"/><text class="badge-t tm" x="515" y="24">2</text></g>
  <g class="badge" data-k="3" tabindex="0" role="button" aria-label="Change 3: root cause data packs"><circle cx="340" cy="200" r="12" class="fa"/><text class="badge-t tm" x="340" y="204">3</text></g>
  </svg>
