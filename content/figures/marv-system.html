<svg viewBox="0 0 380 318" role="img" aria-label="Block diagram of the M.A.R.V. vehicle. OptiTrack motion capture supplies position and heading, an RC receiver supplies manual commands and an MLX90640 thermal camera supplies images to the flight computer, a Raspberry Pi 4 with a Navio2 board. The flight computer sends PWM commands to four speed controllers and motors. The payload pickup, highlighted, is mounted under the frame.">

    <marker id="ms-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="mk"/></marker>

  <rect x="133" y="10" width="114" height="44" rx="3" class="box"/>
  <text class="t11 tm" x="190" y="29">RC receiver</text><text class="t10 tm" x="190" y="44">FlySky FS-iA6B</text>
  <rect x="258" y="10" width="114" height="44" rx="3" class="box"/>

  <polyline points="65,54 65,82 118,82 118,103" class="ln" marker-end="url(#ms-ah)"/>
  <text class="t10" x="12" y="76">position, heading</text>
  <line x1="190" y1="54" x2="190" y2="103" class="ln" marker-end="url(#ms-ah)"/>
  <text class="t10" x="197" y="76">manual</text>
  <polyline points="315,54 315,82 262,82 262,103" class="ln" marker-end="url(#ms-ah)"/>
  <text class="t10 te" x="368" y="76">thermal image</text>

  <rect x="76" y="106" width="228" height="96" rx="6" class="box-p"/>

  <text class="t11 tm" x="190" y="131" style="font-weight:600">Navio2</text><text class="t10 tm" x="190" y="144">IMU, barometer, PWM out</text>

  <line x1="281" y1="202" x2="281" y2="240" class="ghost"/>
  <text class="t10 te" x="274" y="229">mounted under frame</text>
  <rect x="206" y="240" width="166" height="60" rx="3" class="box-a"/>
  <text class="t12 ta tm" x="289" y="261">Payload pickup</text>
